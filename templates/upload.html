<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload - HELMGUARD</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            🪖 HELMGUARD
        </div>

        <ul>

            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/upload">Upload</a>
            </li>

            <li>
                <a href="/dashboard">Dashboard</a>
            </li>

            <li>
                <a href="/history">History</a>
            </li>

        </ul>

    </nav>


    <!-- Upload Section -->
    <section class="hero">

        <h1>Upload Traffic Image or Video</h1>

        <p>
            Upload an image or video to detect helmet and
            no-helmet riders.
        </p>


        <form action="/upload" method="POST" enctype="multipart/form-data">

            <!-- File selection -->
            <label for="image" class="file-label">
                📁 Choose Image or Video
            </label>

            <input type="file" id="image" name="image" accept="image/*,video/*" required>

            <!-- Selected file name -->
            <p id="file-name">
                No image or video selected
            </p>

            <!-- Submit -->
            <button type="submit" class="btn">
                🔍 Detect Helmet
            </button>

        </form>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 HELMGUARD | MCA Mini Project
        </p>

    </footer>


    <!-- Display selected file name -->
    <script>

        const imageInput = document.getElementById("image");
        const fileName = document.getElementById("file-name");

        imageInput.addEventListener("change", function () {

            if (this.files.length > 0) {

                fileName.textContent =
                    "Selected: " + this.files[0].name;

            } else {

                fileName.textContent =
                    "No image or video selected";

            }

        });

    </script>

</body>

</html>
